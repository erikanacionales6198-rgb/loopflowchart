
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erika's Loop Flowchart Activity</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    color: #5E5674;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
}

/* BACKGROUND VIDEO */

#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
    pointer-events: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(248, 245, 255, 0.55);
    backdrop-filter: blur(2px);
    z-index: -2;
    pointer-events: none;
}

/* DREAMY GLOWING BLOBS */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(70px);
    z-index: -1;
    pointer-events: none;
}

body::before {
    top: -80px;
    left: -80px;
    background: rgba(185, 161, 255, 0.28);
}

body::after {
    bottom: -100px;
    right: -80px;
    background: rgba(255, 196, 235, 0.25);
}

/* NAVIGATION */

nav {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    z-index: 100;
}

.logo {
    color: #8367EB;
    font-size: 22px;
    font-weight: 700;
}

/* HERO SECTION */

.hero {
    text-align: center;
    padding: 80px 20px 45px;
}

.badge {
    display: inline-block;
    background: rgba(238, 232, 255, 0.9);
    color: #8367EB;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 500;
}

.hero h1 {
    color: #6D56D8;
    font-size: 46px;
    margin-bottom: 12px;
}

.hero p {
    max-width: 640px;
    margin: auto;
    line-height: 1.8;
    color: #6E6883;
}

/* FLOWCHART GALLERY */

.gallery {
    max-width: 1150px;
    margin: auto;
    padding: 20px 30px 70px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.card {
    width: 100%;
    text-align: left;
    background: rgba(255, 255, 255, 0.42);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 24px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.35s, box-shadow 0.35s;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 36px rgba(131, 103, 235, 0.18);
}

.card:focus-visible,
button:focus-visible,
.close:focus-visible {
    outline: 3px solid #8367EB;
    outline-offset: 4px;
}

.card img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: contain;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 16px;
}

.card h3 {
    text-align: center;
    margin: 12px 0 6px;
    color: #7B63E5;
    font-size: 17px;
    font-weight: 500;
}

/* FULLSCREEN VIEWER */

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(34, 22, 65, 0.94);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
    padding: 65px 20px 25px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 90%;
    max-height: 68vh;
    object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
}

.close {
    position: absolute;
    top: 18px;
    right: 25px;
    color: white;
    font-size: 34px;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 4px 12px;
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 22px;
}

button.nav-button {
    border: none;
    background: linear-gradient(135deg, #8B6FE8, #B395FF);
    color: white;
    padding: 12px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    transition: transform 0.3s;
}

button.nav-button:hover {
    transform: translateY(-2px);
}

.counter {
    color: white;
    margin-top: 14px;
    font-size: 15px;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 30px;
    color: #817895;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 768px) {
    .hero {
        padding: 60px 20px 35px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 20px;
        gap: 15px;
    }

    .card img {
        height: 220px;
    }

    .lightbox img {
        max-width: 100%;
        max-height: 65vh;
    }
}

@media (max-width: 420px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .card img {
        height: 280px;
    }

    .logo {
        font-size: 19px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .controls {
        gap: 10px;
    }

    button.nav-button {
        padding: 10px 15px;
    }
}

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bg-video" aria-hidden="true">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- NAVIGATION -->
<nav>
    <div class="logo">🌸 Erika's Flowcharts</div>
</nav>

<!-- HERO SECTION -->
<section class="hero">
    <div class="badge">Comp 002 • Programming 1</div>

    <h1>Loop Flowcharts</h1>

    <p>
        A collection of ten (10) loop flowcharts created for my
        Programming 1 coursework. Explore the flowcharts below and
        click any image to view it in full size.
    </p>
</section>

<!-- GALLERY -->
<main class="gallery" id="gallery" aria-label="Loop flowchart gallery"></main>

<!-- FULLSCREEN VIEWER -->
<div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Flowchart image viewer"
    aria-hidden="true"
>
    <button class="close" id="closeButton" aria-label="Close viewer">
        &times;
    </button>

    <img id="preview" alt="">

    <div class="controls">
        <button class="nav-button" id="previousButton">
            ⬅ Previous
        </button>

        <button class="nav-button" id="nextButton">
            Next ➡
        </button>
    </div>

    <div class="counter" id="counter" aria-live="polite"></div>
</div>

<!-- FOOTER -->
<footer>
    Made with 💜 by Erika Nacionales
</footer>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const preview = document.getElementById("preview");
const counter = document.getElementById("counter");
const closeButton = document.getElementById("closeButton");

const images = [
    "loop1.jpg",
    "loop2.jpg",
    "loop3.jpg",
    "loop4.jpg",
    "loop5.jpg",
    "loop6.jpg",
    "loop7.jpg",
    "loop8.jpg",
    "loop9.jpg",
    "loop10.jpg"
];

let current = 0;
let lastFocusedElement = null;

/* GENERATE GALLERY CARDS */

images.forEach((img, index) => {
    const card = document.createElement("button");

    card.className = "card";
    card.type = "button";
    card.setAttribute(
        "aria-label",
        `View Loop Flowchart ${index + 1}`
    );

    card.innerHTML = `
        <img src="${img}" alt="Loop Flowchart ${index + 1}" loading="lazy">
        <h3>Loop Flowchart ${index + 1}</h3>
    `;

    card.addEventListener("click", () => openBox(index));

    gallery.appendChild(card);
});

/* OPEN VIEWER */

function openBox(index) {
    current = index;
    lastFocusedElement = document.activeElement;

    updatePreview();

    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    closeButton.focus();
}

/* UPDATE IMAGE AND COUNTER */

function updatePreview() {
    preview.src = images[current];
    preview.alt = `Loop Flowchart ${current + 1}`;

    counter.textContent =
        `Loop Flowchart ${current + 1} of ${images.length}`;
}

/* CLOSE VIEWER */

function closeBox() {
    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";

    if (lastFocusedElement) {
        lastFocusedElement.focus();
    }
}

/* NEXT AND PREVIOUS */

function next() {
    current = (current + 1) % images.length;
    updatePreview();
}

function previous() {
    current = (current - 1 + images.length) % images.length;
    updatePreview();
}

/* BUTTON EVENTS */

closeButton.addEventListener("click", closeBox);

document.getElementById("nextButton")
    .addEventListener("click", next);

document.getElementById("previousButton")
    .addEventListener("click", previous);

/* CLOSE WHEN CLICKING OUTSIDE THE IMAGE */

lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
        closeBox();
    }
});

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("active")) return;

    if (event.key === "ArrowRight") {
        next();
    } else if (event.key === "ArrowLeft") {
        previous();
    } else if (event.key === "Escape") {
        closeBox();
    }
});
</script>

</body>
</html>
